# Exact fixture exceptions; all default detection rules remain enabled.
[extend]
useDefault = true

[[rules]]
id = "curl-auth-header"
[[rules.allowlists]]
description = "Synthetic decoder redaction fixture"
condition = "AND"
paths = ['''(^|/)internal/agent/pi/adapter_test\.go$''']
regexTarget = "line"
regexes = ['''^\s*first := \[\]byte\(`\{"type":"agent_start","message":\{"thinking":"secret"\}\}` \+ "\\n" \+ `\{"type":"tool_execution_start","toolName":"bash","args":\{"command":"curl -H '[A]uthorization: Bearer swordfish' https://example\.test","password":"secret"\}\}`\)$''']

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "HTTP idempotency key in cancellation fixture"
condition = "AND"
paths = ['''(^|/)internal/localweb/u3_preflight_gate_test\.go$''']
regexTarget = "line"
regexes = ['''^\s*map\[string\]string\{"Idempotency-[K]ey": "u3-cancel-verification"\}, http\.StatusAccepted, nil\)$''']

[[rules.allowlists]]
description = "Literal research delegation browser-test idempotency key"
condition = "AND"
paths = ['''(^|/)e2e/project-document\.spec\.ts$''']
regexTarget = "line"
regexes = ['''^\s*const ack = await request\.post\('/api/agent-execution/trusted-local-acknowledgements', \{ headers: \{ 'Idempotency-[K]ey': 'delegation-e2e-ack' \}, data: \{ policyVersion: 'chora\.trusted-local-disclosure\.v1' \} \}\)$''']

[[rules.allowlists]]
description = "Pinned public DeepSeek tokenizer SHA256"
condition = "AND"
paths = ['''(^|/)services/workflow/src/chora_workflow/batch\.py$''']
regexTarget = "line"
regexes = ['''^\s*"tokenizer_sha256": "8f9f37ca37fdc4f5fd36d5cf4d3b0e8392edb4e894fd10cc0d70b4957c8633cf",$''']
