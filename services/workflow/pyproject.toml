[project]
name = "chora-workflow"
version = "0.1.0"
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "langgraph==1.2.20",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg[binary,pool]==3.3.9",
  "openai==3.49.0",
  "pydantic==2.14.3",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.3.0", "ruff==0.15.7"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["postgres: requires CHORA_WORKFLOW_TEST_DSN for a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100
